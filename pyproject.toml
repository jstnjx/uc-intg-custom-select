[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uc-intg-custom-select"
version = "0.1.0"
description = "Image-backed custom Select entities for Unfolded Circle Remote Two and Remote 3"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MPL-2.0" }
authors = [{ name = "jstnjx" }]
dependencies = [
    "ucapi>=0.7.0",
    "ucapi-framework>=1.9.6",
    "unfurled>=0.4.1",
]

[project.urls]
Homepage = "https://github.com/jstnjx/uc-intg-custom-select"
Repository = "https://github.com/jstnjx/uc-intg-custom-select"

[project.scripts]
uc-intg-custom-select = "uc_intg_custom_select:main"

[tool.hatch.build.targets.wheel]
packages = ["uc_intg_custom_select"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

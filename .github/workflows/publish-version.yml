name: Publish integration version

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-integration-version
  cancel-in-progress: false

jobs:
  tag-and-release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Tag and dispatch release build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(python -c 'import json; print(json.load(open("driver.json"))["version"])')"
          tag="v${version}"
          sha="${{ github.event.workflow_run.head_sha }}"
          git fetch --force --tags origin

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "${tag}")"
            if [[ "${tag_sha}" != "${sha}" ]]; then
              if gh release view "${tag}" >/dev/null 2>&1; then
                echo "${tag} is already released from ${tag_sha}; bump driver.json before publishing new code." >&2
                exit 1
              fi
              echo "${tag} already exists at ${tag_sha}, expected ${sha}." >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" "${sha}" -m "Custom Select UC Integration ${tag}"
            git push origin "refs/tags/${tag}"
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists"
            exit 0
          fi

          gh workflow run build.yml --ref "${tag}"

name: Cleanup replacement helpers

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/replace-v0.1.0.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary branches
        shell: bash
        run: |
          git push origin --delete replace-v0.1.0-temp || true
          git push origin --delete noop-ignore || true
